# TimescaleDB stack for the home energy management system.
# Run from the deploy/ directory with: docker compose up -d
# Variables come from .env in the same directory (generated by deploy-db.sh).

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: ems-timescaledb
    environment:
      POSTGRES_USER: ems
      POSTGRES_PASSWORD: "${EMS_DB_PASSWORD}"
      POSTGRES_DB: energy
    volumes:
      - ./data/timescaledb:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      # Reachable only on the server's LAN address, not on 0.0.0.0.
      - "${EMS_DB_BIND_IP}:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ems -d energy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nightly backup outside the database volume: 14 daily and 8 weekly dumps.
  db-backup:
    image: prodrigestivill/postgres-backup-local
    container_name: ems-db-backup
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_USER: ems
      POSTGRES_PASSWORD: "${EMS_DB_PASSWORD}"
      POSTGRES_DB: energy
      POSTGRES_EXTRA_OPTS: "-Z9"
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 14
      BACKUP_KEEP_WEEKS: 8
    volumes:
      - ./backups:/backups
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped
